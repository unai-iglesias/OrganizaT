<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Tareas">
<title>Mis Tareas</title>
<link rel="icon" type="image/png" href="icono_app.png">
<link rel="apple-touch-icon" href="icono_app.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.08);
    --border2: rgba(0,0,0,0.14);
    --text: #1a1a18;
    --text2: #6b6b65;
    --text3: #a8a8a0;
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  .topbar {
    display: flex;
    align-items: center;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 0.5px solid var(--border);
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
  }
  .sync-badge {
    font-size: 11px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .sync-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #639922;
  }
  .sync-dot.syncing { background: #BA7517; animation: pulse 1s infinite; }
  .sync-dot.error { background: #A32D2D; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* LAYOUT */
  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* SIDEBAR */
  .sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 0.5px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sb-section {
    padding: 14px 12px 6px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text3);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .lists-scroll { flex: 1; overflow-y: auto; padding: 0 8px; }
  .list-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    margin-bottom: 2px;
    transition: background 0.12s;
    user-select: none;
  }
  .list-item:hover { background: var(--surface2); }
  .list-item.active { background: var(--surface2); }
  .list-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .list-name { flex: 1; font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .list-count {
    font-size: 11px; color: var(--text3);
    background: var(--bg);
    border-radius: 8px;
    padding: 1px 7px;
    min-width: 20px;
    text-align: center;
  }
  .list-edit-btn {
    opacity: 0;
    font-size: 14px;
    color: var(--text3);
    cursor: pointer;
    padding: 2px;
    border-radius: 4px;
    transition: opacity 0.12s;
  }
  .list-item:hover .list-edit-btn { opacity: 1; }
  .sb-bottom {
    padding: 8px;
    border-top: 0.5px solid var(--border);
  }
  .add-list-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
    transition: background 0.12s;
    width: 100%;
    border: none;
    background: none;
    font-family: inherit;
  }
  .add-list-btn:hover { background: var(--surface2); color: var(--text); }

  /* MAIN */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .main-header {
    padding: 12px 16px;
    border-bottom: 0.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .main-title-area { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .main-title { font-size: 15px; font-weight: 600; color: var(--text); }
  .active-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cal-nav { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    width: 28px; height: 28px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text2);
    font-size: 16px;
    transition: background 0.12s;
  }
  .nav-btn:hover { background: var(--surface2); }
  .month-label { font-size: 13px; font-weight: 500; color: var(--text); min-width: 130px; text-align: center; }
  .view-tabs { display: flex; gap: 3px; }
  .vtab {
    padding: 5px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    background: none;
    font-size: 12px;
    cursor: pointer;
    color: var(--text2);
    font-family: inherit;
    transition: all 0.12s;
  }
  .vtab.active { background: var(--surface2); color: var(--text); border-color: var(--border2); font-weight: 500; }

  /* CALENDAR */
  .content-area { flex: 1; overflow: auto; padding: 10px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .day-name { text-align: center; font-size: 11px; color: var(--text3); padding: 4px; font-weight: 500; }
  .day-cell {
    min-height: 76px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    padding: 4px;
    background: var(--surface);
    transition: border-color 0.12s;
  }
  .day-cell:hover { border-color: var(--border2); }
  .day-cell.other-month { background: var(--bg); opacity: 0.5; }
  .day-cell.today { border-color: #378ADD; }
  .day-num { font-size: 11px; color: var(--text2); margin-bottom: 3px; font-weight: 500; }
  .day-cell.today .day-num { color: #185FA5; font-weight: 600; }
  .cal-task {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 4px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }

  /* LIST VIEW */
  .list-view-wrap { padding: 2px; }
  .add-task-top {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 0.5px dashed var(--border2);
    background: none;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 10px;
    width: 100%;
    font-family: inherit;
    transition: background 0.12s;
  }
  .add-task-top:hover { background: var(--surface); color: var(--text); }
  .task-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border);
    background: var(--surface);
    margin-bottom: 5px;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .task-row:hover { border-color: var(--border2); }
  .task-bar { width: 3px; border-radius: 2px; align-self: stretch; flex-shrink: 0; }
  .task-body { flex: 1; min-width: 0; }
  .task-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .task-meta { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .check-btn { font-size: 18px; color: var(--text3); cursor: pointer; flex-shrink: 0; margin-top: 1px; line-height: 1; border: none; background: none; }

  /* MODAL */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    backdrop-filter: blur(2px);
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border2);
    padding: 22px;
    width: 320px;
    max-width: 92vw;
    box-shadow: 0 8px 32px rgba(0,0,0,0.12);
  }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: var(--text); }
  .fg { margin-bottom: 11px; }
  .fg label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }
  .fg input, .fg select, .fg textarea {
    width: 100%;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.12s;
  }
  .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: #378ADD; }
  .fg textarea { resize: vertical; min-height: 55px; }
  .pcolors { display: flex; gap: 7px; margin-top: 5px; }
  .pc { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.12s, transform 0.12s; }
  .pc:hover { transform: scale(1.15); }
  .pc.sel { border-color: var(--text); }
  .mactions { display: flex; gap: 7px; margin-top: 16px; }
  .btn-p {
    flex: 1; padding: 9px;
    border-radius: var(--radius);
    border: none;
    background: #27500A;
    color: #EAF3DE;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.12s;
  }
  .btn-p:hover { background: #3B6D11; }
  .btn-c {
    padding: 9px 14px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: none;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-c:hover { background: var(--surface2); }
  .btn-d {
    padding: 9px 12px;
    border-radius: var(--radius);
    border: 0.5px solid #F09595;
    background: none;
    color: #A32D2D;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-d:hover { background: #FCEBEB; }
  .empty { text-align: center; color: var(--text3); font-size: 13px; padding: 40px 12px; }
  .empty-icon { font-size: 28px; margin-bottom: 8px; }

  /* LOADER */
  .loader {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    z-index: 200;
  }
  .loader-spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border2);
    border-top-color: #378ADD;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loader-text { font-size: 13px; color: var(--text2); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  /* MOBILE */
  @media (max-width: 600px) {
    .sidebar { width: 180px; min-width: 180px; }
    .month-label { min-width: 90px; font-size: 11px; }
    .modal { padding: 16px; }
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Cargando tareas...</div>
</div>

<div class="topbar">
  <div class="topbar-title">📋 Mis Tareas</div>
  <div class="sync-badge">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncText">Sincronizado</span>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sb-section">Listas</div>
    <div class="lists-scroll" id="listsArea"></div>
    <div class="sb-bottom">
      <button class="add-list-btn" onclick="openListModal()">
        <span style="font-size:16px">＋</span> Nueva lista
      </button>
    </div>
  </div>
  <div class="main">
    <div class="main-header" id="mainHeader"></div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>

<div class="overlay" id="overlay" style="display:none" onclick="handleOverlayClick(event)">
  <div class="modal" id="modalBox"></div>
</div>

<script>
const SB_URL = 'https://focgxgvavxykelzxcjcx.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvY2d4Z3Zhdnh5a2VsenhjamN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMDUwMzEsImV4cCI6MjA5NDU4MTAzMX0.NzfePlNP4Ue344SQUP5_DOFSDNrvhSf9vs31M1a81VU';
const HEADERS = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const DAYS_S = ['Lu','Ma','Mi','Ju','Vi','Sa','Do'];
const COLORS = [
  {c:'#378ADD',t:'#E6F1FB'},{c:'#A32D2D',t:'#FCEBEB'},{c:'#BA7517',t:'#FAEEDA'},
  {c:'#639922',t:'#EAF3DE'},{c:'#533AB7',t:'#EEEDFE'},{c:'#0F6E56',t:'#E1F5EE'},{c:'#993556',t:'#FBEAF0'}
];

const today = new Date();
let curYear = today.getFullYear(), curMonth = today.getMonth();
let curView = 'cal', activeListId = 'all';
let editTaskId = null, editListId = null;
let selColor = COLORS[0].c, selText = COLORS[0].t;
let lists = [], tasks = [];

async function api(method, table, body, id) {
  setSyncing(true);
  try {
    let url = `${SB_URL}/rest/v1/${table}`;
    if (id) url += `?id=eq.${id}`;
    const res = await fetch(url, { method, headers: HEADERS, body: body ? JSON.stringify(body) : undefined });
    const data = method === 'DELETE' ? [] : await res.json();
    setSyncing(false);
    return data;
  } catch(e) {
    setError();
    return null;
  }
}

function setSyncing(s) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if (s) { dot.className='sync-dot syncing'; txt.textContent='Sincronizando...'; }
  else { dot.className='sync-dot'; txt.textContent='Sincronizado'; }
}
function setError() {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className='sync-dot error'; txt.textContent='Error de conexión';
}

async function loadAll() {
  const [l, t] = await Promise.all([
    api('GET','lists'),
    api('GET','tasks')
  ]);
  lists = l || [];
  tasks = t || [];
  document.getElementById('loader').style.display = 'none';
  render();
}

function getListColor(listId) {
  const l = lists.find(x => x.id === listId);
  return l ? {c: l.color, t: l.text_color} : {c:'#888780', t:'#F1EFE8'};
}

function visibleTasks() {
  if (activeListId === 'all') return tasks;
  return tasks.filter(t => t.list_id === activeListId);
}

function todayStr() {
  return `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
}

function render() { renderSidebar(); renderMain(); }

function renderSidebar() {
  const allCount = tasks.filter(t => !t.done).length;
  let html = `<div class="list-item${activeListId==='all'?' active':''}" onclick="setList('all')">
    <div class="list-dot" style="background:var(--text3)"></div>
    <span class="list-name">Todas las tareas</span>
    <span class="list-count">${allCount}</span>
  </div>`;
  lists.forEach(l => {
    const cnt = tasks.filter(t => t.list_id === l.id && !t.done).length;
    html += `<div class="list-item${activeListId===l.id?' active':''}" onclick="setList('${l.id}')">
      <div class="list-dot" style="background:${l.color}"></div>
      <span class="list-name">${l.name}</span>
      <span class="list-count">${cnt}</span>
      <span class="list-edit-btn" onclick="openListModal('${l.id}');event.stopPropagation()" title="Editar lista">✎</span>
    </div>`;
  });
  document.getElementById('listsArea').innerHTML = html;
}

function renderMain() {
  const activeList = lists.find(x => x.id === activeListId);
  const dotColor = activeList ? activeList.color : 'var(--text3)';
  const title = activeList ? activeList.name : 'Todas las tareas';
  document.getElementById('mainHeader').innerHTML = `
    <div class="main-title-area">
      <div class="active-dot" style="background:${dotColor}"></div>
      <span class="main-title">${title}</span>
    </div>
    <div class="cal-nav">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <span class="month-label">${MONTHS[curMonth]} ${curYear}</span>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>
    <div class="view-tabs">
      <button class="vtab${curView==='cal'?' active':''}" onclick="switchView('cal')">Calendario</button>
      <button class="vtab${curView==='list'?' active':''}" onclick="switchView('list')">Lista</button>
    </div>`;
  if (curView === 'cal') renderCalendar();
  else renderList();
}

function renderCalendar() {
  const first = new Date(curYear, curMonth, 1);
  let startDay = first.getDay() - 1; if (startDay < 0) startDay = 6;
  const dim = new Date(curYear, curMonth+1, 0).getDate();
  const dimp = new Date(curYear, curMonth, 0).getDate();
  const ts = todayStr();
  const vtasks = visibleTasks();
  const taskMap = {};
  vtasks.forEach(t => { if(t.date)(taskMap[t.date]=taskMap[t.date]||[]).push(t); });

  let html = '<div class="cal-grid">';
  DAYS_S.forEach(d => html += `<div class="day-name">${d}</div>`);
  for (let i = 0; i < 42; i++) {
    let d, m = curMonth, y = curYear, other = false;
    if (i < startDay) { d = dimp-startDay+i+1; m = curMonth-1; other=true; if(m<0){m=11;y=curYear-1;} }
    else if (i >= startDay+dim) { d = i-startDay-dim+1; m = curMonth+1; other=true; if(m>11){m=0;y=curYear+1;} }
    else d = i - startDay + 1;
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = ds === ts;
    const dt = taskMap[ds] || [];
    html += `<div class="day-cell${other?' other-month':''}${isToday?' today':''}">`;
    html += `<div class="day-num">${d}</div>`;
    dt.slice(0,3).forEach(t => {
      const lc = getListColor(t.list_id);
      html += `<div class="cal-task" style="background:${lc.c};color:${lc.t};${t.done?'opacity:0.4':''}" onclick="openTaskModal('${t.id}')" title="${t.title}">${t.done?'✓ ':''}${t.title}</div>`;
    });
    if (dt.length > 3) html += `<div style="font-size:9px;color:var(--text3);padding:0 2px">+${dt.length-3} más</div>`;
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('contentArea').innerHTML = html;
}

function renderList() {
  const vtasks = visibleTasks().filter(t => {
    if (!t.date) return false;
    const [y,m] = t.date.split('-');
    return parseInt(y)===curYear && parseInt(m)-1===curMonth;
  }).sort((a,b) => a.date.localeCompare(b.date));

  let html = `<div class="list-view-wrap">
    <button class="add-task-top" onclick="openTaskModal()">＋ Nueva tarea</button>`;

  if (!vtasks.length) {
    html += `<div class="empty"><div class="empty-icon">📭</div>Sin tareas en ${MONTHS[curMonth]}</div>`;
  } else {
    vtasks.forEach(t => {
      const lc = getListColor(t.list_id);
      const lname = lists.find(x => x.id === t.list_id)?.name || '';
      const [,m,d] = t.date.split('-');
      html += `<div class="task-row" onclick="openTaskModal('${t.id}')">
        <div class="task-bar" style="background:${lc.c}"></div>
        <div class="task-body">
          <div class="task-title" style="${t.done?'text-decoration:line-through;opacity:0.45':''}">${t.title}</div>
          <div class="task-meta">${d}/${m}${lname?' · <span style="color:'+lc.c+';font-weight:500">'+lname+'</span>':''}${t.description?' · '+t.description:''}</div>
        </div>
        <button class="check-btn" onclick="toggleDone('${t.id}',event)" title="Marcar completada" style="color:${t.done?lc.c:'var(--text3)'}">${t.done?'✓':'○'}</button>
      </div>`;
    });
  }
  html += '</div>';
  document.getElementById('contentArea').innerHTML = html;
}

function changeMonth(d) { curMonth+=d; if(curMonth>11){curMonth=0;curYear++;} if(curMonth<0){curMonth=11;curYear--;} render(); }
function switchView(v) { curView=v; render(); }
function setList(id) { activeListId=id; render(); }

async function toggleDone(id, e) {
  e.stopPropagation();
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.done = !t.done;
  render();
  await api('PATCH', 'tasks', {done: t.done}, id);
}

function openTaskModal(id) {
  editTaskId = id || null;
  const t = id ? tasks.find(x => x.id === id) : null;
  let defList = activeListId === 'all' ? (lists[0]?.id || '') : activeListId;
  let opts = lists.map(l => `<option value="${l.id}"${(t?t.list_id:defList)===l.id?' selected':''}>${l.name}</option>`).join('');
  const html = `<h3>${id ? 'Editar tarea' : 'Nueva tarea'}</h3>
    <div class="fg"><label>Título</label><input type="text" id="fTitle" value="${t?t.title:''}" placeholder="¿Qué tienes que hacer?"/></div>
    <div class="fg"><label>Lista</label><select id="fList">${opts}</select></div>
    <div class="fg"><label>Fecha</label><input type="date" id="fDate" value="${t?t.date:todayStr()}"/></div>
    <div class="fg"><label>Descripción</label><textarea id="fDesc" placeholder="Detalles opcionales...">${t?t.description:''}</textarea></div>
    <div class="mactions">
      <button class="btn-c" onclick="closeModal()">Cancelar</button>
      ${id?`<button class="btn-d" onclick="deleteTask()">🗑</button>`:''}
      <button class="btn-p" onclick="saveTask()">Guardar</button>
    </div>`;
  showModal(html);
  setTimeout(() => document.getElementById('fTitle')?.focus(), 50);
}

function openListModal(id) {
  editListId = id || null;
  const l = id ? lists.find(x => x.id === id) : null;
  selColor = l ? l.color : COLORS[0].c;
  selText = l ? l.text_color : COLORS[0].t;
  let phtml = COLORS.map(col =>
    `<div class="pc${col.c===selColor?' sel':''}" style="background:${col.c}" data-c="${col.c}" data-t="${col.t}" onclick="selListColor(this)"></div>`
  ).join('');
  const html = `<h3>${id ? 'Editar lista' : 'Nueva lista'}</h3>
    <div class="fg"><label>Nombre</label><input type="text" id="lName" value="${l?l.name:''}" placeholder="Ej: Urgente, Fútbol, Trabajo..."/></div>
    <div class="fg"><label>Color</label><div class="pcolors">${phtml}</div></div>
    <div class="mactions">
      <button class="btn-c" onclick="closeModal()">Cancelar</button>
      ${id?`<button class="btn-d" onclick="deleteList()">🗑</button>`:''}
      <button class="btn-p" onclick="saveList()">Guardar</button>
    </div>`;
  showModal(html);
  setTimeout(() => document.getElementById('lName')?.focus(), 50);
}

function selListColor(el) {
  selColor = el.dataset.c; selText = el.dataset.t;
  document.querySelectorAll('.pc').forEach(e => e.classList.remove('sel'));
  el.classList.add('sel');
}

function showModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('overlay').style.display = 'flex';
}
function closeModal() {
  document.getElementById('overlay').style.display = 'none';
  editTaskId = null; editListId = null;
}
function handleOverlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

async function saveTask() {
  const title = document.getElementById('fTitle').value.trim();
  const date = document.getElementById('fDate').value;
  const list_id = document.getElementById('fList').value;
  if (!title || !date) return;
  const description = document.getElementById('fDesc').value.trim();
  if (editTaskId) {
    const t = tasks.find(x => x.id === editTaskId);
    Object.assign(t, {title, date, list_id, description});
    closeModal(); render();
    await api('PATCH', 'tasks', {title, date, list_id, description}, editTaskId);
  } else {
    const id = 't' + Date.now();
    const newTask = {id, list_id, title, date, description, done: false};
    tasks.push(newTask);
    closeModal(); render();
    await api('POST', 'tasks', newTask);
  }
}

async function deleteTask() {
  tasks = tasks.filter(x => x.id !== editTaskId);
  const id = editTaskId;
  closeModal(); render();
  await api('DELETE', 'tasks', null, id);
}

async function saveList() {
  const name = document.getElementById('lName').value.trim();
  if (!name) return;
  if (editListId) {
    const l = lists.find(x => x.id === editListId);
    Object.assign(l, {name, color: selColor, text_color: selText});
    closeModal(); render();
    await api('PATCH', 'lists', {name, color: selColor, text_color: selText}, editListId);
  } else {
    const id = 'l' + Date.now();
    const newList = {id, name, color: selColor, text_color: selText};
    lists.push(newList);
    closeModal(); render();
    await api('POST', 'lists', newList);
  }
}

async function deleteList() {
  const id = editListId;
  lists = lists.filter(x => x.id !== id);
  tasks = tasks.filter(x => x.list_id !== id);
  if (activeListId === id) activeListId = 'all';
  closeModal(); render();
  await api('DELETE', 'lists', null, id);
}

loadAll();
</script>
</body>
</html>
