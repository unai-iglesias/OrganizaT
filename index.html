<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OrganizaT">
<title>OrganizaT</title>
<link rel="icon" type="image/png" href="icono_app.png">
<link rel="apple-touch-icon" href="icono_app.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  :root{--bg:#f5f4f0;--surface:#fff;--surface2:#f0efe9;--border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.14);--text:#1a1a18;--text2:#6b6b65;--text3:#a8a8a0;--radius:10px;--radius-lg:14px}
  @media(prefers-color-scheme:dark){:root.theme-auto{--bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#f0efe9;--text2:#a8a8a0;--text3:#6b6b65}}
  :root.theme-dark{--bg:#1a1a18;--surface:#242422;--surface2:#2e2e2b;--border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.13);--text:#f0efe9;--text2:#a8a8a0;--text3:#6b6b65}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;transition:background .2s,color .2s}
  .topbar{display:flex;align-items:center;padding:0 16px;height:52px;background:var(--surface);border-bottom:.5px solid var(--border);gap:10px;flex-shrink:0}
  .topbar-title{font-size:15px;font-weight:600;color:var(--text);flex:1}
  .sync-badge{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:5px}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:#639922}
  .sync-dot.syncing{background:#BA7517;animation:pulse 1s infinite}
  .sync-dot.error{background:#A32D2D}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .icon-btn{width:28px;height:28px;border-radius:var(--radius);border:.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:background .12s;flex-shrink:0;color:var(--text2)}
  .icon-btn:hover{background:var(--surface2)}
  .notif-btn-wrap{position:relative}
  .notif-badge{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#A32D2D;border:1.5px solid var(--surface);display:none}
  .notif-badge.on{display:block}
  .layout{display:flex;flex:1;overflow:hidden}
  .sidebar{width:220px;min-width:220px;background:var(--surface);border-right:.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:width .2s,min-width .2s}
  .sidebar.collapsed{width:0;min-width:0;border-right:none}
  .sb-header{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 6px;flex-shrink:0}
  .sb-section-label{font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase}
  .collapse-btn{width:22px;height:22px;border-radius:6px;border:.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:13px;transition:background .12s}
  .collapse-btn:hover{background:var(--surface2);color:var(--text)}
  .expand-btn{width:28px;height:28px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--surface);cursor:pointer;display:none;align-items:center;justify-content:center;color:var(--text2);font-size:15px;flex-shrink:0}
  .expand-btn.visible{display:flex}
  .sb-nav{display:flex;gap:3px;padding:6px 8px;flex-shrink:0}
  .sb-nav-btn{flex:1;padding:5px 0;border-radius:var(--radius);border:.5px solid var(--border);background:none;font-size:11px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .12s;text-align:center}
  .sb-nav-btn.active{background:var(--surface2);color:var(--text);border-color:var(--border2);font-weight:500}
  .lists-scroll{flex:1;overflow-y:auto;padding:0 8px}
  .list-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;margin-bottom:2px;transition:background .12s;user-select:none}
  .list-item:hover,.list-item.active{background:var(--surface2)}
  .list-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .list-name{flex:1;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list-count{font-size:11px;color:var(--text3);background:var(--bg);border-radius:8px;padding:1px 7px;min-width:20px;text-align:center}
  .list-edit-btn{opacity:0;font-size:14px;color:var(--text3);cursor:pointer;padding:2px;border-radius:4px;transition:opacity .12s}
  .list-item:hover .list-edit-btn{opacity:1}
  .sb-bottom{padding:8px;border-top:.5px solid var(--border);display:flex;flex-direction:column;gap:3px;flex-shrink:0}
  .add-list-btn{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;transition:background .12s;width:100%;border:none;background:none;font-family:inherit}
  .add-list-btn:hover{background:var(--surface2);color:var(--text)}
  .date-separator{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
  .date-separator:first-child{margin-top:0}
  .date-sep-label{font-size:11px;font-weight:600;color:var(--text2);white-space:nowrap;letter-spacing:.03em}
  .date-sep-line{flex:1;height:.5px;background:var(--border2)}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .main-header{padding:12px 16px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--surface);flex-wrap:wrap;flex-shrink:0}
  .main-title-area{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
  .main-title{font-size:15px;font-weight:600;color:var(--text)}
  .active-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .cal-nav{display:flex;align-items:center;gap:6px}
  .nav-btn{width:28px;height:28px;border-radius:var(--radius);border:.5px solid var(--border2);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:16px;transition:background .12s}
  .nav-btn:hover{background:var(--surface2)}
  .month-label{font-size:13px;font-weight:500;color:var(--text);min-width:130px;text-align:center}
  .view-tabs{display:flex;gap:3px}
  .vtab{padding:5px 12px;border-radius:var(--radius);border:.5px solid var(--border);background:none;font-size:12px;cursor:pointer;color:var(--text2);font-family:inherit;transition:all .12s}
  .vtab.active{background:var(--surface2);color:var(--text);border-color:var(--border2);font-weight:500}
  .content-area{flex:1;overflow:auto;padding:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .day-name{text-align:center;font-size:11px;color:var(--text3);padding:4px;font-weight:500}
  .day-cell{min-height:76px;border-radius:var(--radius);border:.5px solid var(--border);padding:4px;background:var(--surface);transition:border-color .12s,background .12s;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .day-cell:hover{border-color:var(--border2);background:var(--surface2)}
  .day-cell.other-month{background:var(--bg);opacity:.5}
  .day-cell.today{border-color:#378ADD}
  .day-cell.drag-over{border-color:#378ADD!important;background:rgba(55,138,221,.1)!important}
  .day-num{font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500}
  .day-cell.today .day-num{color:#185FA5;font-weight:600}
  .cal-task{font-size:10px;padding:2px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;transition:opacity .12s}
  .cal-task:active{cursor:grabbing}
  .cal-task.dragging{opacity:.35}
  .list-view-wrap{padding:2px}
  .add-task-top{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:var(--radius);border:.5px dashed var(--border2);background:none;color:var(--text2);font-size:13px;cursor:pointer;margin-bottom:10px;width:100%;font-family:inherit;transition:background .12s}
  .add-task-top:hover{background:var(--surface);color:var(--text)}
  .task-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:var(--radius);border:.5px solid var(--border);background:var(--surface);margin-bottom:5px;cursor:pointer;transition:border-color .12s}
  .task-row:hover{border-color:var(--border2)}
  .task-bar{width:3px;border-radius:2px;align-self:stretch;flex-shrink:0}
  .task-body{flex:1;min-width:0}
  .task-title-text{font-size:13px;font-weight:500;color:var(--text)}
  .task-meta{font-size:11px;color:var(--text3);margin-top:3px}
  .check-btn{font-size:18px;cursor:pointer;flex-shrink:0;margin-top:1px;line-height:1;border:none;background:none}
  .notes-area{padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-content:start}
  .note-card{border-radius:var(--radius-lg);padding:14px;cursor:pointer;min-height:120px;display:flex;flex-direction:column;gap:8px;transition:transform .12s,box-shadow .12s}
  .note-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .note-card-title{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .note-card-preview{font-size:12px;opacity:.75;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;flex:1;line-height:1.5}
  .note-card-date{font-size:10px;opacity:.55;margin-top:auto}
  .note-add-card{border-radius:var(--radius-lg);padding:14px;cursor:pointer;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:.5px dashed var(--border2);background:none;color:var(--text3);transition:background .12s;font-family:inherit;width:100%}
  .note-add-card:hover{background:var(--surface);color:var(--text2)}
  .note-content-input{flex:1;border:none;background:none;font-size:13px;color:var(--text);font-family:inherit;outline:none;resize:none;padding:16px;line-height:1.7;width:100%}
  .note-content-input::placeholder{color:var(--text3)}
  .note-title-input{flex:1;border:none;background:none;font-size:15px;font-weight:600;color:var(--text);font-family:inherit;outline:none;min-width:0}
  .note-title-input::placeholder{color:var(--text3)}
  .note-back-btn{padding:5px 10px;border-radius:var(--radius);border:.5px solid var(--border2);background:none;color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
  .note-back-btn:hover{background:var(--surface2)}
  .note-editor{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .note-editor-toolbar{padding:8px 16px;border-top:.5px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--surface);flex-shrink:0}
  .note-color-dot{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .12s;flex-shrink:0}
  .note-color-dot:hover{transform:scale(1.15)}
  .note-color-dot.sel{border-color:var(--text)}
  .note-save-info{font-size:11px;color:var(--text3);margin-left:auto}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  .modal{background:var(--surface);border-radius:var(--radius-lg);border:.5px solid var(--border2);padding:22px;width:340px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
  .modal h3{font-size:15px;font-weight:600;margin-bottom:16px;color:var(--text)}
  .fg{margin-bottom:11px}
  .fg label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
  .fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .12s}
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:#378ADD}
  .fg textarea{resize:vertical;min-height:55px}
  .fg-row{display:flex;gap:8px}
  .fg-row .fg{flex:1}
  .notif-section{border-top:.5px solid var(--border2);margin:12px 0 11px;padding-top:12px}
  .notif-section-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:8px}
  .notif-row{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--bg);margin-bottom:8px}
  .notif-row-label{font-size:12px;color:var(--text2)}
  .notif-hint{font-size:11px;color:var(--text3);line-height:1.6}
  .aviso-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .aviso-item{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius);border:.5px solid var(--border2);background:var(--bg);position:relative}
  .aviso-item.disabled{opacity:.45}
  .aviso-emoji{font-size:14px;flex-shrink:0}
  .aviso-type-select{flex:1;padding:3px 6px;border-radius:6px;border:.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:11px;font-family:inherit;outline:none;cursor:pointer}
  .aviso-time-input{width:80px;padding:3px 6px;border-radius:6px;border:.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:11px;font-family:inherit;outline:none}
  .aviso-toggle{flex-shrink:0}
  .aviso-remove{flex-shrink:0;background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;border-radius:4px}
  .aviso-remove:hover{color:#A32D2D;background:#FCEBEB}
  .add-aviso-btn{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:var(--radius);border:.5px dashed var(--border2);background:none;color:var(--text3);font-size:12px;cursor:pointer;width:100%;font-family:inherit;transition:background .12s;margin-top:2px}
  .add-aviso-btn:hover{background:var(--surface);color:var(--text2)}
  .add-aviso-btn:disabled{opacity:.35;cursor:not-allowed}
  .toggle{position:relative;width:36px;height:20px;display:inline-block}
  .toggle input{opacity:0;width:0;height:0;position:absolute}
  .toggle-slider{position:absolute;inset:0;background:var(--border2);border-radius:10px;cursor:pointer;transition:background .2s}
  .toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:transform .2s}
  .toggle input:checked+.toggle-slider{background:#639922}
  .toggle input:checked+.toggle-slider:before{transform:translateX(16px)}
  .color-picker-wrap{margin-top:5px}
  .color-presets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .pc{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border-color .12s,transform .12s;flex-shrink:0}
  .pc:hover{transform:scale(1.15)}
  .pc.sel{border-color:var(--text)}
  .custom-color-row{display:flex;align-items:center;gap:8px}
  .custom-color-row label{font-size:11px;color:var(--text2);white-space:nowrap}
  .custom-color-row input[type=color]{width:36px;height:28px;border-radius:6px;border:.5px solid var(--border2);padding:2px;background:var(--bg);cursor:pointer}
  .custom-color-preview{flex:1;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
  .mactions{display:flex;gap:7px;margin-top:16px}
  .btn-p{flex:1;padding:9px;border-radius:var(--radius);border:none;background:#27500A;color:#EAF3DE;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
  .btn-p:hover{background:#3B6D11}
  .btn-c{padding:9px 14px;border-radius:var(--radius);border:.5px solid var(--border2);background:none;color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit}
  .btn-c:hover{background:var(--surface2)}
  .btn-d{padding:9px 12px;border-radius:var(--radius);border:.5px solid #F09595;background:none;color:#A32D2D;font-size:13px;cursor:pointer;font-family:inherit}
  .btn-d:hover{background:#FCEBEB}
  .empty{text-align:center;color:var(--text3);font-size:13px;padding:40px 12px}
  .empty-icon{font-size:28px;margin-bottom:8px}
  .loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200}
  .loader-spinner{width:32px;height:32px;border:2px solid var(--border2);border-top-color:#378ADD;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-text{font-size:13px;color:var(--text2)}
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loader-spinner"></div><div class="loader-text">Cargando OrganizaT...</div></div>
<div class="topbar">
  <button class="expand-btn" id="expandBtn" onclick="toggleSidebar()">›</button>
  <div class="topbar-title">📋 OrganizaT</div>
  <div class="sync-badge"><div class="sync-dot" id="syncDot"></div><span id="syncText">Sincronizado</span></div>
  <div class="notif-btn-wrap"><button class="icon-btn" id="notifBtn" onclick="toggleNotifications()">🔕</button><div class="notif-badge" id="notifBadge"></div></div>
  <button class="icon-btn" id="themeBtn" onclick="cycleTheme()">🌗</button>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sb-header"><span class="sb-section-label" id="sbLabel">Listas</span><button class="collapse-btn" onclick="toggleSidebar()">‹</button></div>
    <div class="sb-nav">
      <button class="sb-nav-btn active" id="navTasks" onclick="switchSection('tasks')">Tareas</button>
      <button class="sb-nav-btn" id="navNotes" onclick="switchSection('notes')">Notas</button>
    </div>
    <div class="lists-scroll" id="listsArea"></div>
    <div class="sb-bottom">
      <button class="add-list-btn" id="sbAddMain" onclick="openTaskModal()"><span style="font-size:16px">＋</span> Nueva tarea</button>
      <button class="add-list-btn" id="sbAddList" onclick="openListModal()"><span style="font-size:16px;opacity:.6">⊞</span> Nueva lista</button>
    </div>
  </div>
  <div class="main">
    <div class="main-header" id="mainHeader"></div>
    <div class="content-area" id="contentArea"></div>
  </div>
</div>
<div class="overlay" id="overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

    {id:'a2',type:'same_day',hour:'08:00',enabled:true},
  ];
  if(taskTime) avisos.push({id:'a3',type:'before_1h',hour:'',enabled:true});
  return avisos;
}
function avisoLabel(a){
  if(a.type==='exact')return`⏰ Hora exacta: ${a.hour||'--:--'}`;
  if(a.type==='prev_day')return`📅 Día anterior a las ${a.hour}`;
  if(a.type==='same_day')return`☀️ Mismo día a las ${a.hour}`;
  if(a.type==='before_1h')return`⏰ 1 hora antes`;
  if(a.type==='before_30m')return`⏰ 30 min antes`;
  return'';
}
const AVISO_EMOJIS={prev_day:'📅',same_day:'☀️',exact:'🕐',before_1h:'⏰',before_30m:'⏰'};
 
// ── HELPERS ──────────────────────────────────────────────────────────────────
function autoTextColor(hex){
  if(!hex||hex.length<7)return'#f0efe9';
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return(0.299*r+0.587*g+0.114*b)/255>0.55?'#1a1a18':'#f0efe9';
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function todayStr(){return`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;}
function getListColor(listId){
  const l=lists.find(x=>x.id===listId);
  if(!l)return{c:'#888780',t:'#F1EFE8'};
  return{c:l.color,t:l.text_color||autoTextColor(l.color)};
}
function visibleTasks(){return activeListId==='all'?tasks:tasks.filter(t=>t.list_id===activeListId);}

// ── API SUPABASE ──────────────────────────────────────────────────────────────
async function api(method,table,body,id){
  setSyncing(true);
  try{
    let url=`${SB_URL}/rest/v1/${table}`;
    if(id) url+=`?id=eq.${id}`;
    const hdrs={
      'apikey':SB_KEY,
      'Authorization':'Bearer '+SB_KEY,
      'Content-Type':'application/json',
      'Prefer':'return=representation'
    };
    const res=await fetch(url,{method,headers:hdrs,body:body?JSON.stringify(body):undefined});
    if(!res.ok){
      const err=await res.text();
      console.error('Supabase error',method,table,id,err);
      setError();
      return null;
    }
    const data=(method==='DELETE'||res.status===204)?[]:await res.json();
    setSyncing(false);
    return data;
  }catch(e){console.error('API error',e);setError();return null;}
}
function setSyncing(s){document.getElementById('syncDot').className='sync-dot'+(s?' syncing':'');document.getElementById('syncText').textContent=s?'Sincronizando...':'Sincronizado';}
function setError(){document.getElementById('syncDot').className='sync-dot error';document.getElementById('syncText').textContent='Error de conexión';}
 
// ── FIREBASE ─────────────────────────────────────────────────────────────────
async function initFirebase(){
  try{
    firebase.initializeApp(FB_CONFIG);
    messaging=firebase.messaging();
    // Registrar el service worker manualmente para controlar la ruta
    if('serviceWorker' in navigator){
      const reg=await navigator.serviceWorker.register('./firebase-messaging-sw.js');
      await messaging.useServiceWorker(reg);
    }
    messaging.onMessage(payload=>{
      const{title,body}=payload.notification;
      showInAppNotif(title,body);
    });
    if(localStorage.getItem('ot_notif')==='on') await enableNotifications(false);
    updateNotifUI();
  }catch(e){console.warn('Firebase no disponible:',e);}
}
async function enableNotifications(ask=true){
  if(!messaging)return;
  try{
    let perm=Notification.permission;
    if(perm==='default'&&ask)perm=await Notification.requestPermission();
    if(perm!=='granted'){alert('Permite las notificaciones en tu navegador.');return;}
    const token=await messaging.getToken({vapidKey:VAPID_KEY});
    if(token){localStorage.setItem('ot_fcm_token',token);localStorage.setItem('ot_notif','on');notifEnabled=true;scheduleNotifications();updateNotifUI();}
  }catch(e){console.warn('Error notificaciones:',e);}
}
async function disableNotifications(){notifEnabled=false;localStorage.setItem('ot_notif','off');notifTimers.forEach(t=>clearTimeout(t));notifTimers=[];updateNotifUI();}
function toggleNotifications(){if(notifEnabled)disableNotifications();else enableNotifications(true);}
function updateNotifUI(){document.getElementById('notifBtn').textContent=notifEnabled?'🔔':'🔕';document.getElementById('notifBadge').classList.toggle('on',!notifEnabled&&Notification.permission==='default');}
function showInAppNotif(title,body){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:16px;right:16px;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius-lg);padding:14px 16px;box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:999;max-width:300px;font-family:inherit';
  el.innerHTML=`<div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px">🔔 ${esc(title)}</div><div style="font-size:12px;color:var(--text2)">${esc(body)}</div>`;
  document.body.appendChild(el);setTimeout(()=>el.remove(),5000);
}
function scheduleNotifications(){
  notifTimers.forEach(t=>clearTimeout(t));notifTimers=[];
  if(!notifEnabled)return;
  const now=new Date();
  tasks.filter(t=>t.notify&&!t.done&&t.date).forEach(t=>{
    const avisos=t.avisos||defaultAvisos(t.time);
    const[ty,tm,td]=t.date.split('-').map(Number);
    avisos.filter(a=>a.enabled).forEach(a=>{
      let when=null;
      if(a.type==='prev_day'&&a.hour){
        const[h,m]=a.hour.split(':').map(Number);
        when=new Date(ty,tm-1,td-1,h,m,0);
      }else if(a.type==='same_day'&&a.hour){
        const[h,m]=a.hour.split(':').map(Number);
        when=new Date(ty,tm-1,td,h,m,0);
      }else if(a.type==='exact'&&a.hour){
        const[h,m]=a.hour.split(':').map(Number);
        when=new Date(ty,tm-1,td,h,m,0);
      }else if(a.type==='before_1h'&&t.time){
        const[h,m]=t.time.split(':').map(Number);
        when=new Date(new Date(ty,tm-1,td,h,m,0).getTime()-3600000);
      }else if(a.type==='before_30m'&&t.time){
        const[h,m]=t.time.split(':').map(Number);
        when=new Date(new Date(ty,tm-1,td,h,m,0).getTime()-1800000);
      }
      if(when){
        const label=avisoLabel(a);
        scheduleOne(when,now,`🔔 ${label}`,t.title,t.id+'_'+a.id);
      }
    });
  });
}
function scheduleOne(when,now,title,body,tag){
  const diff=when.getTime()-now.getTime();
  if(diff>0)notifTimers.push(setTimeout(()=>{if(Notification.permission==='granted')new Notification(title,{body,icon:'/icono_app.png',tag});},diff));
}

async function cleanCompleted(){

  const toDelete=tasks.filter(t=>t.done&&t.date&&t.date<ts);
  for(const t of toDelete){tasks=tasks.filter(x=>x.id!==t.id);await api('DELETE','tasks',null,t.id);}

async function loadAll(){
  const[l,t,n]=await Promise.all([api('GET','lists'),api('GET','tasks'),api('GET','notes')]);
  lists=l||[];tasks=t||[];notes=n||[];

function renderCalendar(){
  const first=new Date(curYear,curMonth,1);
  let startDay=first.getDay()-1;if(startDay<0)startDay=6;
  const dim=new Date(curYear,curMonth+1,0).getDate(),dimp=new Date(curYear,curMonth,0).getDate();
  const ts=todayStr(),vtasks=visibleTasks(),taskMap={};
  vtasks.forEach(t=>{if(t.date)(taskMap[t.date]=taskMap[t.date]||[]).push(t);});
  let html='<div class="cal-grid">';
  DAYS_S.forEach(d=>html+=`<div class="day-name">${d}</div>`);
  for(let i=0;i<42;i++){
    let d,m=curMonth,y=curYear,other=false;
    if(i<startDay){d=dimp-startDay+i+1;m=curMonth-1;other=true;if(m<0){m=11;y=curYear-1;}}
    else if(i>=startDay+dim){d=i-startDay-dim+1;m=curMonth+1;other=true;if(m>11){m=0;y=curYear+1;}}
    else d=i-startDay+1;
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt=taskMap[ds]||[];
    html+=`<div class="day-cell${other?' other-month':''}${ds===ts?' today':''}"
      onclick="handleDayClick(event,'${ds}')"
      ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event,'${ds}')">`;
    html+=`<div class="day-num">${d}</div>`;
    dt.slice(0,3).forEach(t=>{
      const lc=getListColor(t.list_id);
      html+=`<div class="cal-task"
        style="background:${lc.c}!important;color:${lc.t}!important;-webkit-text-fill-color:${lc.t};${t.done?'opacity:.4':''}"
        draggable="true" ondragstart="handleDragStart(event,'${t.id}')" ondragend="handleDragEnd(event)"
        onclick="event.stopPropagation();openTaskModal('${t.id}')">${t.done?'✓ ':''}${t.time?'⏰ ':''}${t.notify?'🔔 ':''}${esc(t.title)}</div>`;
    });
    if(dt.length>3)html+=`<div style="font-size:9px;color:var(--text3);padding:0 2px">+${dt.length-3} más</div>`;
    html+='</div>';
  }
  document.getElementById('contentArea').innerHTML=html+'</div>';
}
 
function renderList(){
  const vtasks=visibleTasks().filter(t=>{
    if(!t.date)return false;
    const[y,m]=t.date.split('-');
    return parseInt(y)===curYear&&parseInt(m)-1===curMonth;
  }).sort((a,b)=>{const dc=a.date.localeCompare(b.date);return dc!==0?dc:(a.time||'').localeCompare(b.time||'');});
  let html='<div class="list-view-wrap"><button class="add-task-top" onclick="openTaskModal()">＋ Nueva tarea</button>';
  if(!vtasks.length){html+=`<div class="empty"><div class="empty-icon">📭</div>Sin tareas en ${MONTHS[curMonth]}</div>`;}
  else{
    let lastDate=null;
    vtasks.forEach(t=>{
      const lc=getListColor(t.list_id);
      const lname=lists.find(x=>x.id===t.list_id)?.name||'';
      const[y,m,d]=t.date.split('-');
      if(t.date!==lastDate){
        lastDate=t.date;
        const dateObj=new Date(parseInt(y),parseInt(m)-1,parseInt(d));
        const diff=Math.round((dateObj-new Date(today.getFullYear(),today.getMonth(),today.getDate()))/86400000);
        const label=diff===0?'Hoy':diff===1?'Mañana':diff===-1?'Ayer':`${d} ${MONTHS[parseInt(m)-1]}`;
        html+=`<div class="date-separator"><span class="date-sep-label">${label}</span><div class="date-sep-line"></div></div>`;
      }
      html+=`<div class="task-row" onclick="openTaskModal('${t.id}')">
        <div class="task-bar" style="background:${lc.c}"></div>
        <div class="task-body">
          <div class="task-title-text" style="${t.done?'text-decoration:line-through;opacity:.45':''}">${t.notify?'🔔 ':''}${esc(t.title)}</div>
          <div class="task-meta">${t.time?`⏰ ${t.time} · `:''}${lname?`<span style="color:${lc.c};font-weight:500">${esc(lname)}</span>`:''}${t.description?(lname?' · ':'')+esc(t.description):''}</div>
        </div>
        <button class="check-btn" onclick="toggleDone('${t.id}',event)" style="color:${t.done?lc.c:'var(--text3)'}">${t.done?'✓':'○'}</button>
      </div>`;
    });
  }
  document.getElementById('contentArea').innerHTML=html+'</div>';
}

function openTaskModal(id,preDate){
  editTaskId=id||null;
  const t=id?tasks.find(x=>x.id===id):null;
  let defList=activeListId==='all'?(lists[0]?.id||''):activeListId;
  let opts=lists.map(l=>`<option value="${l.id}"${(t?t.list_id:defList)===l.id?' selected':''}>${esc(l.name)}</option>`).join('');
  const dateVal=t?t.date:(preDate||todayStr());
  const timeVal=t?(t.time||''):'';
  const notifyVal=t?(t.notify===true):notifEnabled;
  // Inicializar avisos temporales
  modalAvisos=t?.avisos?JSON.parse(JSON.stringify(t.avisos)):defaultAvisos(timeVal);
  const html=`<h3>${id?'Editar tarea':'Nueva tarea'}</h3>
    <div class="fg"><label>Título</label><input type="text" id="fTitle" value="${esc(t?t.title:'')}" placeholder="¿Qué tienes que hacer?"/></div>
    <div class="fg"><label>Lista</label><select id="fList">${opts}</select></div>
    <div class="fg-row">
      <div class="fg"><label>Fecha</label><input type="date" id="fDate" value="${dateVal}"/></div>
      <div class="fg"><label>Hora <span style="color:var(--text3);font-weight:400">(opcional)</span></label><input type="time" id="fTime" value="${timeVal}" oninput="onTaskTimeChange(this.value)"/></div>
    </div>
    <div class="fg"><label>Descripción <span style="color:var(--text3);font-weight:400">(opcional)</span></label><textarea id="fDesc" placeholder="Detalles..."></textarea></div>
    <div class="notif-section">
      <div class="notif-row" style="margin-bottom:10px">
        <span class="notif-row-label" style="font-weight:600">🔔 Avisos</span>
        <label class="toggle"><input type="checkbox" id="fNotify" ${notifyVal?'checked':''} onchange="renderAvisoList()"><span class="toggle-slider"></span></label>
      </div>
      <div id="avisoContainer"></div>
    </div>
    <div class="mactions">
      <button class="btn-c" onclick="closeModal()">Cancelar</button>
      ${id?`<button class="btn-d" onclick="deleteTask()">🗑</button>`:''}
      <button class="btn-p" onclick="saveTask()">Guardar</button>
    </div>`;
  showModal(html);
  document.getElementById('fDesc').value=t?(t.description||''):'';
  renderAvisoList();
}
 
function renderAvisoList(){
  const enabled=document.getElementById('fNotify')?.checked;
  const container=document.getElementById('avisoContainer');
  if(!container)return;
  if(!enabled){container.innerHTML='<div style="font-size:11px;color:var(--text3);padding:2px 0">Activa los avisos para configurarlos.</div>';return;}
  const taskTime=document.getElementById('fTime')?.value||'';
  const hasTime=!!taskTime;
  let html='<div class="aviso-list">';
  modalAvisos.forEach((a,i)=>{
    const emoji=AVISO_EMOJIS[a.type]||'🔔';
    const needsHour=a.type==='prev_day'||a.type==='same_day'||a.type==='exact';
    const needsTime=(a.type==='before_1h'||a.type==='before_30m')&&!hasTime;
    html+=`<div class="aviso-item${a.enabled?'':' disabled'}">
      <span class="aviso-emoji">${emoji}</span>
      <select class="aviso-type-select" onchange="changeAvisoType(${i},this.value)">
        <option value="prev_day"${a.type==='prev_day'?' selected':''}>Día anterior</option>
        <option value="same_day"${a.type==='same_day'?' selected':''}>Mismo día</option>
        <option value="exact"${a.type==='exact'?' selected':''}>Hora exacta</option>
        ${hasTime?`<option value="before_1h"${a.type==='before_1h'?' selected':''}>1 hora antes</option>`:''}
        ${hasTime?`<option value="before_30m"${a.type==='before_30m'?' selected':''}>30 min antes</option>`:''}
      </select>
      ${needsHour?`<input class="aviso-time-input" type="time" value="${a.hour||''}" onchange="changeAvisoHour(${i},this.value)" title="Hora del aviso"/>`:''}
      ${needsTime?`<span style="font-size:10px;color:var(--text3)">Requiere hora</span>`:''}
      <label class="toggle aviso-toggle" title="${a.enabled?'Desactivar':'Activar'}">
        <input type="checkbox" ${a.enabled?'checked':''} onchange="toggleAviso(${i},this.checked)">
        <span class="toggle-slider"></span>
      </label>
      <button class="aviso-remove" onclick="removeAviso(${i})" title="Eliminar aviso">×</button>
    </div>`;
  });
  html+='</div>';
  const canAdd=modalAvisos.length<3;
  html+=`<button class="add-aviso-btn" onclick="addAviso()" ${canAdd?'':'disabled'}><span style="font-size:16px">＋</span> Añadir aviso${canAdd?'':' (máx. 3)'}</button>`;
  container.innerHTML=html;
}
 
function onTaskTimeChange(val){
  // Si se pone/quita hora, actualizar tipos before_* que ya no apliquen
  if(!val){
    modalAvisos=modalAvisos.map(a=>
      (a.type==='before_1h'||a.type==='before_30m')?{...a,type:'same_day',hour:'08:00'}:a
    );
  }
  renderAvisoList();
}
function changeAvisoType(i,type){
  modalAvisos[i].type=type;
  if(type==='prev_day'&&!modalAvisos[i].hour)modalAvisos[i].hour='09:00';
  if(type==='same_day'&&!modalAvisos[i].hour)modalAvisos[i].hour='08:00';
  if(type==='exact'&&!modalAvisos[i].hour)modalAvisos[i].hour='09:00';
  renderAvisoList();
}
function changeAvisoHour(i,val){modalAvisos[i].hour=val;}
function toggleAviso(i,checked){modalAvisos[i].enabled=checked;renderAvisoList();}
function removeAviso(i){modalAvisos.splice(i,1);renderAvisoList();}
function addAviso(){
  if(modalAvisos.length>=3)return;
  const taskTime=document.getElementById('fTime')?.value||'';
  modalAvisos.push({id:'a'+Date.now(),type:'same_day',hour:'09:00',enabled:true});
  renderAvisoList();
}
 
function openListModal(id){
  editListId=id||null;
  const l=id?lists.find(x=>x.id===id):null;
  selColor=l?l.color:PALETTE[0];
  selText=l?(l.text_color||autoTextColor(l.color)):autoTextColor(PALETTE[0]);
  const html=`<h3>${id?'Editar lista':'Nueva lista'}</h3>
    <div class="fg"><label>Nombre</label><input type="text" id="lName" placeholder="Ej: Urgente, Fútbol..."/></div>
    <div class="fg"><label>Color</label>${buildColorPicker(selColor)}</div>
    <div class="mactions">
      <button class="btn-c" onclick="closeModal()">Cancelar</button>
      ${id?`<button class="btn-d" onclick="deleteList()">🗑</button>`:''}
      <button class="btn-p" onclick="saveList()">Guardar</button>
    </div>`;
  showModal(html);
  document.getElementById('lName').value=l?l.name:'';
}
 
// ── GUARDAR / BORRAR ──────────────────────────────────────────────────────────
async function saveTask(){
  const title=document.getElementById('fTitle').value.trim();
  const date=document.getElementById('fDate').value;
  const list_id=document.getElementById('fList').value;
  if(!title||!date)return;
  const description=document.getElementById('fDesc').value.trim();
  const time=document.getElementById('fTime').value||null;
  const notify=document.getElementById('fNotify').checked;
  const avisos=JSON.parse(JSON.stringify(modalAvisos));
  if(editTaskId){
    const id=editTaskId;
    const t=tasks.find(x=>x.id===id);
    Object.assign(t,{title,date,list_id,description,time,notify,avisos});
    closeModal();render();scheduleNotifications();
    await api('PATCH','tasks',{title,date,list_id,description,time,notify,avisos},id);
  }else{
    const id='t'+Date.now();
    const newTask={id,list_id,title,date,description,time,notify,avisos,done:false};
    tasks.push(newTask);closeModal();render();scheduleNotifications();
    await api('POST','tasks',newTask);
  }
}
 
async function deleteTask(){
  const id=editTaskId; // ← captura antes de closeModal()
  tasks=tasks.filter(x=>x.id!==id);
  closeModal();render();
  await api('DELETE','tasks',null,id);
}
 
async function saveList(){
  const name=document.getElementById('lName').value.trim();
  if(!name)return;
  const color=selColor,text_color=selText;
  if(editListId){
    const id=editListId; // ← captura antes de closeModal()
    const l=lists.find(x=>x.id===id);
    Object.assign(l,{name,color,text_color});
    closeModal();render();
    await api('PATCH','lists',{name,color,text_color},id);
  }else{
    const id='l'+Date.now();
    lists.push({id,name,color,text_color});closeModal();render();
    await api('POST','lists',{id,name,color,text_color});
  }
}
 
async function deleteList(){
  const id=editListId; // ← captura antes de closeModal()
  lists=lists.filter(x=>x.id!==id);
  tasks=tasks.filter(x=>x.list_id!==id);
  if(activeListId===id)activeListId='all';
  closeModal();render();
  await api('DELETE','lists',null,id);
}
 
// ── ARRANQUE ──────────────────────────────────────────────────────────────────
applyTheme();
initFirebase().then(()=>loadAll());
</script>
</body>
</html>
